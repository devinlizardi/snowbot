# snowbot configuration.
#
# Secrets NEVER live here — they come from the environment (see .env.example).
# Anything in this file is public: the repo is public.
#
# A gitignored `config.local.yaml` is deep-merged over this file if present,
# so any block can be overridden privately without touching the repo.

timezone: America/New_York
currency_display: USD # everything is normalized to USD before it is shown

discord:
  # Real channel lives on Elliot's guild. The bot is deliberately NOT invited
  # there yet — see PHASE-0.md §3a. Everything through Phase 3 runs against test.
  guild_id_env: DISCORD_GUILD_ID
  channel_id_env: DISCORD_CHANNEL_ID
  test_guild_id_env: DISCORD_TEST_GUILD_ID
  test_channel_id_env: DISCORD_TEST_CHANNEL_ID
  # Backstop against being annoying. See PLAN.md §2.
  max_root_posts_per_day: 2
  anchor:
    # The self-editing pinned Aspen status message.
    pin: true

roster:
  # Public by design — Devin confirmed names + airports in the public repo are fine.
  # Airports are in preference order. `price_all: true` means every listed airport
  # is priced on every search, not just the first.
  - name: Devin
    discord_id_env: DISCORD_USER_DEVIN
    airports: [JFK, LGA, EWR]
    price_all: false
  - name: Andre
    discord_id_env: DISCORD_USER_ANDRE
    airports: [EWR, JFK, LGA]
    price_all: false
  - name: Elliot
    discord_id_env: DISCORD_USER_ELLIOT
    airports: [BUR, LAX]
    price_all: true # both priced every time, delta stated out loud
  - name: Jeremy
    discord_id_env: DISCORD_USER_JEREMY
    airports: [SNA, LAX]
    price_all: true
  - name: Hagen
    discord_id_env: DISCORD_USER_HAGEN
    airports: [SFO, OAK, SJC]
    price_all: false

aspen:
  # "Aspen Snowmass" is four separate mountains — Snowmass, Aspen Mountain
  # (Ajax), Aspen Highlands, Buttermilk — roughly 12 km apart, differing by
  # ~50 m at the base and ~400 m at the summit. Forecasting "Aspen" as one
  # point is wrong, so this models SNOWMASS: the biggest, the most skied, and
  # where a group of five is most likely to be staying. If the trip ends up
  # based on Ajax instead, change these coordinates, not the code.
  #
  # Verified against Wikipedia's ski-area infoboxes, Sept 2026:
  #   Snowmass      base 8,104 ft / 2,470 m   top 12,510 ft / 3,813 m
  #   Aspen Mtn     base 7,945 ft / 2,422 m   top 11,212 ft / 3,417 m
  name: Aspen Snowmass — Snowmass Mountain
  window_start: 2027-01-24
  window_end: 2027-01-30
  base:
    lat: 39.2097
    lon: -106.9489
    elevation_m: 2470
  summit:
    lat: 39.1856
    lon: -106.9653
    elevation_m: 3813
  airports: [ASE, EGE, DEN] # in order of convenience, not price
  cadence:
    monthly_from: 2026-10-01
    weekly_from: 2026-12-14
    daily_from: 2027-01-19

weather:
  # Which WeatherNext door to use: bigquery | maps
  weathernext_provider: bigquery
  bigquery:
    project_id_env: GCP_PROJECT_ID
    # The Analytics Hub *linked dataset* name you chose when subscribing.
    # NOT the table names. Set it in .env once confirmed.
    dataset_id_env: GCP_DATASET_ID
    table_0p1deg: weathernext_3_0_0_0p1deg
    table_0p05deg: weathernext_3_0_0_0p05deg
    preferred_table: table_0p1deg
    # Guardrails — a query that would scan more than this is refused, not run.
    max_bytes_billed: 2000000000 # 2 GB
  open_meteo:
    models: [ecmwf_ifs025, ecmwf_aifs025, icon_eu, gfs_seamless, ncep_nam_conus]
    forecast_days: 15
  cache_ttl_minutes:
    forecast: 180
    archive: 720
    seasonal: 1440
    climatology: 525600 # a finished season never changes; a year so rows can age out
  # Snow history for a trip window, from the Open-Meteo archive (ERA5).
  # Counts and ratios only — the grid undercounts mountain snow, so the cm the
  # group reads come from the resort's own average (lookup:resort-snow).
  climatology:
    seasons: 20 # past seasons summarised per window
    snow_day_cm: 2 # modelled new snow that counts as "a snow day"
    pace_ms: 1500 # wait after each live archive request (free tier: 600 weighted calls/min)

flights:
  provider: serpapi
  date_flex_days: 2
  cache_ttl_hours: 144 # 6 days, per PLAN.md §10
  monthly_search_cap: 220 # degrade to weekly rather than blowing the quota

lodging:
  provider: serpapi
  min_sleeps: 5
  cache_ttl_hours: 144
  # Google prices hotels per room and never says how many a room sleeps, so a
  # hotel is priced as ceil(min_sleeps / this) rooms.
  hotel_guests_per_room: 2
  # Also search whole-place rentals (one more SerpApi search per build).
  search_rentals: true

llm:
  fast_model: claude-haiku-4-5 # routine post formatting
  smart_model: claude-sonnet-4-6 # dossiers, web-search lookups
  monthly_usd_cap: 15

expedition:
  ceiling_usd:
    international: 2600 # provisional — near_misses logs the real numbers
    domestic: 1400
  repeat_cooldown_weeks: 4
  arrival_window_hours: 6
  # The builder never proposes a window outside this span (MM-DD, wraps the year).
  season:
    start: 12-01
    end: 04-15
  # A weekly build's window is always past the 15-day forecast, so what usually
  # falls in that window leads; what's falling now is a smaller snowpack read.
  ranking_weights:
    historical_snow: 0.40
    forecast_snow_10d_confidence_weighted: 0.15
    observed_snow_7d: 0.10
    cost: 0.20
    logistics_ease: 0.15

# Destination board.
# Coordinates are approximate resort-base positions and are flagged for
# verification in Packet 2. `pass_verify: true` means the IKON/blackout answer
# must come from a live lookup (Packet 6) before it can appear in a dossier —
# nothing here is quoted to the group as fact.
#
# `pitch` is the dossier's colour: why the place is worth the flight, in the
# group's terms. Hand-written — edit freely, it's the voice of the pitch. It
# must never carry prices or snow totals; those only come from live data.
#   hook      one line: the reason to go
#   terrain   what the riding is like
#   off_snow  what the days and nights off look like (onsen, food, après)
#   heads_up  the honest caveats a friend would mention
