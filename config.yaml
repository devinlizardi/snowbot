# snowbot configuration.
#
# Secrets NEVER live here — they come from the environment (see .env.example).
# Anything in this file is public: the repo is public.
#
# A gitignored `config.local.yaml` is deep-merged over this file if present,
# so any block can be overridden privately without touching the repo.

timezone: America/New_York
currency_display: USD # everything is normalized to USD before it is shown

discord:
  # Real channel lives on Elliot's guild. The bot is deliberately NOT invited
  # there yet — see PHASE-0.md §3a. Everything through Phase 3 runs against test.
  guild_id_env: DISCORD_GUILD_ID
  channel_id_env: DISCORD_CHANNEL_ID
  test_guild_id_env: DISCORD_TEST_GUILD_ID
  test_channel_id_env: DISCORD_TEST_CHANNEL_ID
  # Backstop against being annoying. See PLAN.md §2.
  max_root_posts_per_day: 2
  anchor:
    # The self-editing pinned Aspen status message.
    pin: true

roster:
  # Public by design — Devin confirmed names + airports in the public repo are fine.
  # Airports are in preference order. `price_all: true` means every listed airport
  # is priced on every search, not just the first.
  - name: Devin
    discord_id_env: DISCORD_USER_DEVIN
    airports: [JFK, LGA, EWR]
    price_all: false
  - name: Andre
    discord_id_env: DISCORD_USER_ANDRE
    airports: [EWR, JFK, LGA]
    price_all: false
  - name: Elliot
    discord_id_env: DISCORD_USER_ELLIOT
    airports: [BUR, LAX]
    price_all: true # both priced every time, delta stated out loud
  - name: Jeremy
    discord_id_env: DISCORD_USER_JEREMY
    airports: [SNA, LAX]
    price_all: true
  - name: Hagen
    discord_id_env: DISCORD_USER_HAGEN
    airports: [SFO, OAK, SJC]
    price_all: false

aspen:
  name: Aspen Snowmass
  window_start: 2027-01-24
  window_end: 2027-01-30
  lat: 39.2084
  lon: -106.9490
  base_elevation_m: 2422
  summit_elevation_m: 3813
  airports: [ASE, EGE, DEN] # in order of convenience, not price
  cadence:
    monthly_from: 2026-10-01
    weekly_from: 2026-12-14
    daily_from: 2027-01-19

weather:
  # Which WeatherNext door to use: bigquery | maps
  weathernext_provider: bigquery
  bigquery:
    project_id_env: GCP_PROJECT_ID
    # The Analytics Hub *linked dataset* name you chose when subscribing.
    # NOT the table names. Set it in .env once confirmed.
    dataset_id_env: GCP_DATASET_ID
    table_0p1deg: weathernext_3_0_0_0p1deg
    table_0p05deg: weathernext_3_0_0_0p05deg
    preferred_table: table_0p1deg
    # Guardrails — a query that would scan more than this is refused, not run.
    max_bytes_billed: 2000000000 # 2 GB
  open_meteo:
    models: [ecmwf_ifs025, ecmwf_aifs025, icon_eu, gfs_seamless, ncep_nam_conus]
    forecast_days: 15
  cache_ttl_minutes:
    forecast: 180
    archive: 720
    seasonal: 1440

flights:
  provider: serpapi
  date_flex_days: 2
  cache_ttl_hours: 144 # 6 days, per PLAN.md §10
  monthly_search_cap: 220 # degrade to weekly rather than blowing the quota

lodging:
  provider: serpapi
  min_sleeps: 5
  cache_ttl_hours: 144

llm:
  fast_model: claude-haiku-4-5 # routine post formatting
  smart_model: claude-sonnet-4-6 # dossiers, web-search lookups
  monthly_usd_cap: 15

expedition:
  ceiling_usd:
    international: 2600 # provisional — near_misses logs the real numbers
    domestic: 1400
  repeat_cooldown_weeks: 4
  arrival_window_hours: 6
  ranking_weights:
    forecast_snow_10d_confidence_weighted: 0.45
    observed_snow_7d: 0.20
    cost: 0.20
    logistics_ease: 0.15

