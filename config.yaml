    summit_elevation_m: 1308
    airport: CTS
    ground: Bus CTS -> Hirafu
    lodging_band_usd_pp_night: [110, 160]
    min_days: 8
    ideal_days: 10
    pass_verify: true
    pitch:
      hook: "The most famous powder on earth — Siberian storms cross the Sea of Japan and unload on Hokkaido almost daily in midwinter."
      terrain:
        - "Four linked resorts around Mt. Annupuri on one all-mountain ticket"
        - "Hirafu and Hanazono tree runs, plus gate-accessed sidecountry"
        - "Floodlit night riding in Hirafu"
      off_snow:
